name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS libraries
        run: |
          # The devkitarm image usually ships these already; only hit the
          # package server (which sometimes refuses CI runners) if missing.
          dkp-pacman -Q 3ds-sdl 3ds-sdl_mixer 3ds-libvorbisidec 3ds-libmad 3ds-libmikmod citro3d || {
            dkp-pacman -Sy --noconfirm &&
            dkp-pacman -S --needed --noconfirm 3ds-sdl 3ds-sdl_mixer
          }
          ls "$DEVKITPRO/portlibs/3ds/lib" | head -50

      - name: Install CIA tools (makerom, bannertool)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq && apt-get install -y -qq curl jq unzip >/dev/null
          mkdir -p /tmp/tools "$DEVKITPRO/tools/bin"

          # Find a release asset by name pattern, so version bumps don't break the build
          asset_url() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" \
              | jq -r --arg re "$2" '.assets[] | select(.name | test($re; "i")) | .browser_download_url' | head -n1
          }

          url=$(asset_url 3DSGuy/Project_CTR 'makerom.*ubuntu.*\.zip$')
          echo "makerom: $url"
          curl -fsSL "$url" -o /tmp/tools/makerom.zip
          unzip -o -q /tmp/tools/makerom.zip -d /tmp/tools/makerom

          url=$(asset_url Epicpkmn11/bannertool 'bannertool.*\.zip$')
          echo "bannertool: $url"
          curl -fsSL "$url" -o /tmp/tools/bannertool.zip
          unzip -o -q /tmp/tools/bannertool.zip -d /tmp/tools/bannertool

          install -m755 "$(find /tmp/tools/makerom -type f -name makerom | head -n1)" "$DEVKITPRO/tools/bin/makerom"
          install -m755 "$(find /tmp/tools/bannertool -type f -path '*linux*x86_64*' -name bannertool | head -n1)" "$DEVKITPRO/tools/bin/bannertool"
          "$DEVKITPRO/tools/bin/makerom" -version || true

      - name: Build .3dsx and .cia
        run: make -j"$(nproc)" BUILD_CIA=1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCadetPinball-3DS-${{ github.sha }}
          path: |
            SpaceCadetPinball.cia
            SpaceCadetPinball.3dsx
          if-no-files-found: error
