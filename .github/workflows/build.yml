name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish releases from version tags

    steps:
      - uses: actions/checkout@v4

      - name: Download CIA tools (makerom, bannertool)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl .tools
          # Find a release asset by name pattern, so version bumps don't break the build
          asset_url() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" \
              | jq -r --arg re "$2" '.assets[] | select(.name | test($re; "i")) | .browser_download_url' | head -n1
          }
          curl -fsSL "$(asset_url 3DSGuy/Project_CTR 'makerom.*ubuntu.*\.zip$')" -o /tmp/dl/makerom.zip
          curl -fsSL "$(asset_url Epicpkmn11/bannertool 'bannertool.*\.zip$')" -o /tmp/dl/bannertool.zip
          unzip -o -q /tmp/dl/makerom.zip -d /tmp/dl/makerom
          unzip -o -q /tmp/dl/bannertool.zip -d /tmp/dl/bannertool
          install -m755 "$(find /tmp/dl/makerom -type f -name makerom | head -n1)" .tools/makerom
          install -m755 "$(find /tmp/dl/bannertool -type f -path '*linux*x86_64*' -name bannertool | head -n1)" .tools/bannertool
          chmod +x .github/record-makerom.sh

      - name: Compile in devkitARM container
        run: |
          docker run --rm -v "$PWD":"$PWD" -w "$PWD" devkitpro/devkitarm:latest bash -c '
            set -e
            dkp-pacman -Q 3ds-sdl 3ds-sdl_mixer || { dkp-pacman -Sy --noconfirm && dkp-pacman -S --needed --noconfirm 3ds-sdl 3ds-sdl_mixer; }
            make -j"$(nproc)" BUILD_CIA=1 TOOLDIR="$PWD/.tools" MAKEROM="$PWD/.github/record-makerom.sh"
          '

      - name: Package CIA on host
        run: |
          sudo chown -R "$(id -u)" .
          eval ".tools/makerom $(cat makerom.args)"
          ls -la SpaceCadetPinball.cia SpaceCadetPinball.3dsx

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCadetPinball-3DS-${{ github.sha }}
          path: |
            SpaceCadetPinball.cia
            SpaceCadetPinball.3dsx
          if-no-files-found: error

      # Publishes a GitHub Release for the app version in the Makefile the first
      # time that version is built on main (v1.0, v1.1, ...). Bump the version to
      # release again. App files only; game data is never included.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major=$(sed -n 's/^APP_VERSION_MAJOR[[:space:]]*:=[[:space:]]*//p' Makefile)
          minor=$(sed -n 's/^APP_VERSION_MINOR[[:space:]]*:=[[:space:]]*//p' Makefile)
          tag="v$major.$minor"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          gh release create "$tag" SpaceCadetPinball.cia SpaceCadetPinball.3dsx \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Space Cadet Pinball for 3DS $tag" \
            --notes-file .github/release-notes.md
